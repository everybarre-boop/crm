# ============================================================================
# 에블바레 — 일간 CRM 자동화 (매일 21:00 KST)
# ----------------------------------------------------------------------------
# 한 번의 실행이 다음을 순서대로 한다:
#   ① 어제(D-1) 출석/결석 확정 스크랩 → members 사용횟수 반영 + 예약 스냅샷 확정
#   ② 내일(D+1) 지점별 예약자 명단 스크랩 → 예약 스냅샷 저장
#   ③ CRM 규칙 평가 → crm_messages / crm_dormant
#   ④ 지점별 슬랙 채널에 통합 메시지 1건 발송
#   ⑤ 실패하면 운영 채널로 알림
#
# 보안: service_role 키를 쓰지 않는다. 관리자 계정으로 로그인해 RLS 안에서 동작한다.
#       비밀값은 저장소가 아니라 GitHub → Settings → Secrets and variables → Actions 에 둔다.
#
# ⚠️ automation/out/*.json 에는 회원 실명이 들어간다 — **artifact 로 업로드하지 말 것.**
#    저장소 권한자 전원이 내려받을 수 있게 된다.
#
# ⚠️ GitHub 의 schedule 은 정각을 보장하지 않는다(부하 시간대엔 수십 분 지연, 드물게 스킵).
#    21:00 은 마지막 수업이 끝난 뒤라 지연에 관대하지만, 정확한 시각이 필요해지면 외부
#    스케줄러(cron-job.org → workflow_dispatch API)를 붙여야 한다.
#
# 필요한 Secrets — 필수 12개 + 선택 2개:
#   (선택) SUPABASE_URL, SUPABASE_ANON_KEY   공개값. 생략 가능(config.mjs 에 기본값 있음)
#   ADMIN_EMAIL, ADMIN_PASSWORD              관리자 계정 — 비밀
#   STUDIOMATE_PHONE, STUDIOMATE_PASSWORD    ⚠️ 이메일 아님. 휴대폰 번호로 로그인한다
#   SLACK_BOT_TOKEN                          xoxb-… (스코프: chat:write, chat:write.public)
#   SLACK_CHANNEL_{CHEONGDAM,OKSU,GWANGGYO,BANPO,PANGYO,SONGPA}
#   SLACK_CHANNEL_OPS                        실패 알림 채널
#   ⚠️ 채널 값은 이름(#광교)이 아니라 **채널 ID(C0123ABCD)** 를 넣는다. 이름은 바뀌면
#      조용히 실패하고, 그러면 그 지점만 CRM 이 끊긴다.
#
# 전환 순서: workflow_dispatch + dry_run=true 로 3~5일 관찰(미매칭률·슬랙 프리뷰 검수)
#            → dry_run=false 수동 1회 → 아래 schedule 주석 해제
# ============================================================================
name: daily-update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '반영/발송 없이 매칭·멘트만 확인(dry-run)'
        type: boolean
        default: true
      target_date:
        description: 'D+1 을 강제 (YYYY-MM-DD). 비우면 자동'
        type: string
        default: ''
      steps:
        description: '부분 실행 (예: roster,crm). 비우면 전체'
        type: string
        default: ''
      # 장애 재현용 — 전 지점을 돌리면 15분이 걸려 원인 확인이 느리다.
      # 한 지점만 찍으면 3분이면 결과가 나온다(2026-08-13 로그인 실패 추적에서 필요했다).
      only_branches:
        description: '특정 지점만 (예: 광교). 비우면 전체'
        type: string
        default: ''
  # schedule:
  #   - cron: '0 12 * * *'   # UTC 12:00 = KST 21:00. 검증이 끝난 뒤 주석 해제.

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 6지점 × 2모드(attendance/roster)
    env:
      TZ: Asia/Seoul # 로그 타임스탬프 가독성용. 날짜 계산은 dateKST() 가 따로 한다.

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      # ⚠️ 스튜디오메이트는 이메일이 아니라 **휴대폰 번호**로 로그인한다.
      STUDIOMATE_PHONE: ${{ secrets.STUDIOMATE_PHONE }}
      STUDIOMATE_PASSWORD: ${{ secrets.STUDIOMATE_PASSWORD }}
      # SM_SLUG_* 는 이제 Secret 이 아니다 — 공개 서브도메인이라 config.mjs 에 기본값이 있다.
      # 다른 스튜디오로 옮길 때만 SM_SLUG_MAIN / _GWANGGYO / _OKSU / _BANPO / _SONGPA 로 덮어쓴다.

      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_CHEONGDAM: ${{ secrets.SLACK_CHANNEL_CHEONGDAM }}
      SLACK_CHANNEL_OKSU: ${{ secrets.SLACK_CHANNEL_OKSU }}
      SLACK_CHANNEL_GWANGGYO: ${{ secrets.SLACK_CHANNEL_GWANGGYO }}
      SLACK_CHANNEL_BANPO: ${{ secrets.SLACK_CHANNEL_BANPO }}
      SLACK_CHANNEL_PANGYO: ${{ secrets.SLACK_CHANNEL_PANGYO }}
      SLACK_CHANNEL_SONGPA: ${{ secrets.SLACK_CHANNEL_SONGPA }}
      SLACK_CHANNEL_OPS: ${{ secrets.SLACK_CHANNEL_OPS }}

      # ⚠️ 예전에는 `inputs.dry_run || 'false'` 였다. schedule 실행에는 inputs 자체가 없어서
      #    폴백에 의존했는데, 그러면 "왜 반영 모드인지"가 코드에 안 드러난다.
      #    이벤트로 명시 분기한다 — schedule = 반영, 수동 = 입력값.
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      TARGET_DATE: ${{ inputs.target_date }}
      STEPS: ${{ inputs.steps }}
      ONLY_BRANCHES: ${{ inputs.only_branches }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # 규칙 경계값 회귀 테스트(수 초). 규칙이 깨진 채로 6개 채널에 뿌리는 걸 막는다.
      - name: Test CRM rules
        run: npm run test:rules

      - name: Run daily CRM automation
        run: node automation/run.mjs

      # run.mjs 자체가 죽는 경우(설치 실패·timeout·OOM)를 위한 마지막 그물.
      # run.mjs 가 이미 알렸으면 automation/out/.notified 마커를 보고 건너뛴다.
      - name: Notify failure
        if: failure()
        run: node automation/notify.mjs "워크플로 실패 (러너/설치 단계 포함 가능)"
